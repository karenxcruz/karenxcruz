<svg xmlns="http://www.w3.org/2000/svg" width="960" height="208" viewBox="0 0 960 208" role="img" aria-label="Mis áreas: frontend, backend y datos">
<title>Mis áreas: frontend, backend y datos</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1c1a30"/><stop offset="1" stop-color="#0e111a"/></linearGradient><linearGradient id="accent"><stop stop-color="#b9a0ff"/><stop offset="1" stop-color="#78efd2"/></linearGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .muted{fill:#aeb5cb}.label{font-size:16px;font-weight:700;letter-spacing:3px}.line{stroke:#30364a;stroke-width:1} .flow{stroke-dasharray:8 18;animation:flow 8s linear infinite}@keyframes flow{to{stroke-dashoffset:-104}} .float{animation:float 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes float{50%{transform:translateY(-7px)}} @media(prefers-reduced-motion:reduce){.flow,.float{animation:none}}</style>
<rect x="1" y="1" width="306" height="206" rx="22" fill="#1c1a30" stroke="#34374c"/>
<rect x="327" y="1" width="306" height="206" rx="22" fill="#152b2c" stroke="#2d4943"/>
<rect x="653" y="1" width="306" height="206" rx="22" fill="#2b2035" stroke="#594362"/>
<text x="25" y="39" class="label" fill="#b9a0ff">01 / FRONTEND</text>
<text x="25" y="90" fill="#f5f3ff" font-size="28" font-weight="700">Lo que ves.</text>
<text x="25" y="133" fill="#c2c5d8" font-size="19">Interfaces claras y</text><text x="25" y="160" fill="#c2c5d8" font-size="19">experiencias prácticas.</text>
<text x="351" y="39" class="label" fill="#78efd2">02 / BACKEND</text>
<text x="351" y="90" fill="#f5f3ff" font-size="28" font-weight="700">Lo que conecta.</text>
<text x="351" y="133" fill="#bed3ce" font-size="19">Lógica, autenticación</text><text x="351" y="160" fill="#bed3ce" font-size="19">y flujos de información.</text>
<text x="677" y="39" class="label" fill="#bda1ff">03 / DATOS</text>
<text x="677" y="90" fill="#f5f3ff" font-size="28" font-weight="700">Lo que sostiene.</text>
<text x="677" y="133" fill="#c8c0da" font-size="19">Información organizada</text><text x="677" y="160" fill="#c8c0da" font-size="19">y persistencia de datos.</text>
</svg>
